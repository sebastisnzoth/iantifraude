<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#08765c"><link rel="icon" href="./icons/shield.svg"><title>AntiGolpe AI</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f6;color:#142b27;font:16px system-ui,sans-serif}main{max-width:780px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}b.logo{font-size:24px;color:#08765c}select,button,textarea{font:inherit}select{padding:8px;border:1px solid #ccd9d4;border-radius:8px;background:white}h1{font-size:clamp(32px,6vw,48px);line-height:1.1;letter-spacing:-2px;margin:40px 0 12px}p{line-height:1.55;color:#51645f}.panel{background:white;border:1px solid #dce6e2;border-radius:20px;padding:24px;margin:24px 0;box-shadow:0 8px 30px #123b2810}textarea{width:100%;min-height:180px;resize:vertical;padding:16px;border:1px solid #b9cbc4;border-radius:12px;margin:12px 0}button{cursor:pointer;border:0;border-radius:10px;padding:14px 18px;background:#08765c;color:white;font-weight:700}button.secondary{background:#e9f3ef;color:#08765c}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #75bca8}.risk{font-size:24px;font-weight:800}li{margin:10px 0;line-height:1.5}.small{font-size:13px}footer{text-align:center;color:#60746d;font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap}
</style><main><header><b class="logo">◈ AntiGolpe AI</b><select id="lang" aria-label="Idioma"><option value="es">Español</option><option value="pt">Português</option><option value="en">English</option></select></header><h1 id="headline"></h1><p id="intro"></p><section class="panel"><label for="message" id="label"></label><textarea id="message" maxlength="20000"></textarea><div class="actions"><button id="scan"></button><button class="secondary" id="example"></button><button class="secondary" id="clear"></button></div><p class="small" id="privacy"></p></section><section class="panel"><h2 id="imageTitle"></h2><input id="image" type="file" accept="image/png,image/jpeg,image/webp" aria-labelledby="imageTitle"><p id="ocrStatus" role="status" class="small"></p><p id="ocrNote" class="small"></p></section><section class="panel" id="result" hidden aria-live="polite"><div id="risk" class="risk"></div><p id="explain"></p><ul id="signals"></ul><h3 id="next"></h3><p id="advice"></p></section><section class="panel"><h2 id="historyTitle"></h2><label><input type="checkbox" id="keep"> <span id="keepLabel"></span></label><ul id="history"></ul><button class="secondary" id="erase"></button></section><footer id="foot"></footer></main><script type="module">
import {analyze} from "./src/engine.js";
const $=id=>document.getElementById(id);
const translations={es:{headline:'Antes de confiar, verificá.',intro:'Detectá señales de posibles estafas en mensajes, correos y enlaces.',label:'Pegá el mensaje o enlace sospechoso',placeholder:'Ej.: Tu cuenta será bloqueada. Confirmá tus datos ahora…',scan:'Analizar riesgo',example:'Probar ejemplo',clear:'Limpiar',privacy:'Privacidad: el análisis se realiza en tu navegador. No enviamos el texto a un servidor.',foot:'MVP experimental · Análisis heurístico local, sin IA conectada. No certifica que un mensaje sea seguro.',levels:['Pocas señales detectadas','Riesgo moderado','Riesgo alto'],explain:'Evaluación orientativa según las señales encontradas; no verifica identidad ni reputación de sitios.',next:'Qué hacer ahora',advice:'No compartas contraseñas ni códigos. Verificá la solicitud por un canal oficial independiente. No abras enlaces sospechosos ni pagues hasta confirmar.',none:'No encontramos patrones conocidos. Esto no descarta una estafa.',empty:'Pegá un mensaje o enlace primero.',sample:'URGENTE: tu cuenta será bloqueada. Confirmá tu contraseña y código de verificación ahora en http://banco-premio.xyz/login'},pt:{headline:'Antes de confiar, verifique.',intro:'Identifique sinais de possíveis golpes em mensagens, e-mails e links.',label:'Cole a mensagem ou link suspeito',placeholder:'Ex.: Sua conta será bloqueada. Confirme seus dados agora…',scan:'Analisar risco',example:'Testar exemplo',clear:'Limpar',privacy:'Privacidade: a análise ocorre no navegador. O texto não é enviado a um servidor.',foot:'MVP experimental · Análise heurística local, sem IA conectada. Não certifica mensagens como seguras.',levels:['Poucos sinais detectados','Risco moderado','Risco alto'],explain:'Avaliação indicativa dos sinais encontrados; não verifica identidade ou reputação de sites.',next:'O que fazer agora',advice:'Não compartilhe senhas nem códigos. Confirme por um canal oficial independente. Não abra links suspeitos nem pague antes de verificar.',none:'Nenhum padrão conhecido encontrado. Isso não descarta um golpe.',empty:'Cole uma mensagem ou link primeiro.',sample:'URGENTE: sua conta será bloqueada. Confirme sua senha e código de verificação agora em http://banco-premio.xyz/login'},en:{headline:'Check before you trust.',intro:'Spot potential scam signals in messages, emails and links.',label:'Paste a suspicious message or link',placeholder:'Example: Your account will be blocked. Confirm your details now…',scan:'Analyze risk',example:'Try example',clear:'Clear',privacy:'Privacy: analysis runs in your browser. Your text is not sent to a server.',foot:'Experimental MVP · Local heuristic analysis, no connected AI. Does not certify messages as safe.',levels:['Few signals detected','Moderate risk','High risk'],explain:'Indicative assessment based on detected signals; does not verify identity or website reputation.',next:'What to do now',advice:'Never share passwords or codes. Verify through an independent official channel. Do not open suspicious links or pay until verified.',none:'No known patterns detected. This does not rule out a scam.',empty:'Paste a message or link first.',sample:'URGENT: your account will be blocked. Confirm your password and verification code now at http://bank-prize.xyz/login'}};
let lang='es';function render(){lang=$('lang').value;document.documentElement.lang=lang;let t=translations[lang];for(let k of ['headline','intro','label','scan','example','clear','privacy','foot','next','advice'])$(k).textContent=t[k];$('message').placeholder=t.placeholder;if(!$('result').hidden)scan()}
function scan(){let s=$('message').value.trim(),t=translations[lang];if(!s){$('result').hidden=true;$('message').setCustomValidity(t.empty);$('message').reportValidity();return}let {found,level}=analyze(s);let ix=['es','pt','en'].indexOf(lang);$('risk').textContent=t.levels[level];$('risk').style.color=['#08765c','#946000','#b42318'][level];$('explain').textContent=t.explain;$('signals').replaceChildren();for(let msg of found.length?found.map(r=>r.labels[ix]):[t.none]){let li=document.createElement('li');li.textContent=msg;$('signals').append(li)}$('result').hidden=false}
$('lang').onchange=render;$('scan').onclick=scan;$('message').oninput=()=>{$('message').setCustomValidity('');$('result').hidden=true};$('example').onclick=()=>{$('message').value=translations[lang].sample;$('message').setCustomValidity('');scan()};$('clear').onclick=()=>{$('message').value='';$('message').setCustomValidity('');$('result').hidden=true;$('message').focus()};render();
const more={es:['Leer captura de pantalla','OCR opcional: descarga el motor y los idiomas desde CDN; la imagen se procesa localmente. Revisá el texto extraído.','Historial privado','Guardar solo fecha, nivel y cantidad de señales en este dispositivo','Borrar historial','Leyendo imagen…','No se pudo leer la imagen. Pegá el texto manualmente.','Imagen demasiado grande (máximo 10 MB).'],pt:['Ler captura de tela','OCR opcional: baixa motor e idiomas via CDN; a imagem é processada localmente. Revise o texto extraído.','Histórico privado','Salvar somente data, nível e quantidade de sinais neste dispositivo','Apagar histórico','Lendo imagem…','Não foi possível ler a imagem. Cole o texto manualmente.','Imagem muito grande (máximo 10 MB).'],en:['Read screenshot','Optional OCR downloads engine and languages via CDN; image processing is local. Review extracted text.','Private history','Save only date, level and signal count on this device','Clear history','Reading image…','Could not read image. Paste text manually.','Image too large (10 MB maximum).']};
let history=[];try{history=JSON.parse(localStorage.getItem('ag-history')||'[]');if(!Array.isArray(history))history=[];}catch{};function saveHistory(){try{localStorage.setItem('ag-history',JSON.stringify(history))}catch{}}function showHistory(){ $('history').replaceChildren();for(const h of history){const li=document.createElement('li');li.textContent=new Date(h.date).toLocaleString(lang)+' · '+translations[lang].levels[h.level]+' · '+h.count; $('history').append(li)}}function renderMore(){const m=more[lang];['imageTitle','ocrNote','historyTitle','keepLabel','erase'].forEach((k,i)=>$(k).textContent=m[i]);showHistory()}$('lang').addEventListener('change',renderMore);renderMore();$('scan').addEventListener('click',()=>{if(!$('keep').checked||!$('message').value.trim())return;const r=analyze($('message').value);history.unshift({date:Date.now(),level:r.level,count:r.found.length});history=history.slice(0,50);saveHistory();showHistory()});$('erase').onclick=()=>{history=[];saveHistory();showHistory()};
$('image').onchange=async()=>{const f=$('image').files[0];if(!f)return;const status=$('ocrStatus');if(f.size>10*1024*1024){status.textContent=more[lang][7];return}status.textContent=more[lang][5];$('image').disabled=true;let worker;try{if(!window.Tesseract){await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';script.onload=resolve;script.onerror=reject;document.head.append(script)})}worker=await window.Tesseract.createWorker('spa+por+eng');const result=await worker.recognize(f);$('message').value=result.data.text.slice(0,20000);$('message').dispatchEvent(new Event('input'));status.textContent='✓';$('message').focus()}catch{status.textContent=more[lang][6]}finally{if(worker)await worker.terminate().catch(()=>{});$('image').disabled=false;$('image').value=''}};
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
